<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政府補助 × 企業內訓 | AI-GOV</title>
  <style>
    :root {
      --bg: #07101f;
      --surface: rgba(255,255,255,0.06);
      --surface-strong: rgba(255,255,255,0.12);
      --text: #eef5ff;
      --muted: #aac4ff;
      --accent: #4fb0ff;
      --border: rgba(255,255,255,0.14);
      --radius: 24px;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(79,176,255,0.18), transparent 24%),
                  radial-gradient(circle at 80% 10%, rgba(106,254,220,0.1), transparent 20%),
                  linear-gradient(180deg, #08101f 0%, #010409 100%);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 120px 24px 40px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      backdrop-filter: blur(18px);
      background: rgba(4, 12, 24, 0.84);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      gap: 16px;
    }

    .nav-left,
    .nav-center,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-left img,
    .footer-logo img {
      display: block;
      width: 140px;
      max-width: 100%;
      height: auto;
      cursor: pointer;
    }

    .nav-center {
      flex: 1;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .nav-center a {
      color: var(--muted);
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-center a:hover,
    .nav-center a:focus-visible {
      color: var(--text);
    }

    .nav-right .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      border: 1px solid transparent;
      background: linear-gradient(135deg, #4fb0ff, #72d4ff);
      color: #03131f;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-right .cta-button:hover,
    .nav-right .cta-button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(79,176,255,0.22);
    }

    .hero {
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      padding-top: 24px;
    }

    .hero-title {
      font-size: clamp(3rem, 5vw, 5rem);
      line-height: 0.95;
      margin: 0;
    }

    .hero-subtitle {
      max-width: 760px;
      margin: 0;
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.9;
    }

    .section-card {
      margin-top: 80px;
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.03);
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
    }

    .section-card h2 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 2rem;
      color: #ffffff;
    }

    .section-card .placeholder {
      min-height: 180px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,0.18);
      font-size: 0.97rem;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 40px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .footer-right {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 520px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .image-grid figure {
      margin: 0;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .image-grid img {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }

    .image-grid img:hover {
      transform: scale(1.02);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 24px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-image {
      max-width: 95%;
      max-height: 95%;
      border-radius: 22px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.55);
    }

    @media (max-width: 820px) {
      .nav-container {
        flex-wrap: wrap;
        justify-content: center;
      }
      .nav-center {
        justify-content: center;
      }
      .nav-right {
        order: 3;
        width: 100%;
        justify-content: center;
      }
      .nav-left {
        width: 100%;
        justify-content: center;
      }
      .page-shell {
        padding-top: 140px;
      }
      .footer {
        padding-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav-container" aria-label="主要導覽列">
      <div class="nav-left">
        <a href="https://semeel2014.github.io/Lab2026-05/gov/index.html" aria-label="回到首頁">
          <img src="AI-GOV.png" alt="AI-GOV 公司 LOGO" />
        </a>
      </div>
      <div class="nav-center">
        <a href="#course">課程亮點</a>
        <a href="#teachers">講師團隊</a>
        <a href="#subsidy">補助方案</a>
        <a href="#gallery">服務照片錦集</a>
      </div>
      <div class="nav-right">
        <a class="cta-button" href="#subsidy">立即一起申請補助</a>
      </div>
    </nav>
  </header>

  <main class="page-shell">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <h1 id="hero-title" class="hero-title">政府補助 × 企業內訓</h1>
        <p class="hero-subtitle">打造公私協力的數位轉型內訓計畫，協助企業有效運用政府補助資源，讓團隊快速升級實戰力。</p>
      </div>
    </section>

    <section id="course" class="section-card" aria-labelledby="course-title">
      <h2 id="course-title">課程亮點</h2>
      <div class="placeholder">此處為課程亮點內容，待後續補充。</div>
    </section>

    <section id="teachers" class="section-card" aria-labelledby="teachers-title">
      <h2 id="teachers-title">講師團隊</h2>
      <div class="placeholder">此處為講師團隊內容，待後續補充。</div>
    </section>

    <section id="subsidy" class="section-card" aria-labelledby="subsidy-title">
      <h2 id="subsidy-title">補助方案</h2>
      <div class="placeholder">此處為補助方案內容，待後續補充。</div>
    </section>

    <section id="gallery" class="section-card" aria-labelledby="gallery-title">
      <h2 id="gallery-title">服務照片錦集</h2>
      <div class="image-grid">
        <figure>
          <img src="AI-GOV.png" alt="AI-GOV 範例圖 1" />
        </figure>
        <figure>
          <img src="AI-GOV.png" alt="AI-GOV 範例圖 2" />
        </figure>
        <figure>
          <img src="AI-GOV.png" alt="AI-GOV 範例圖 3" />
        </figure>
      </div>
      <p class="placeholder" style="margin-top: 24px;">服務照片區塊可在後續補入真實案例圖片。</p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-logo">
      <a href="https://semeel2014.github.io/Lab2026-05/gov/index.html" aria-label="回到首頁">
        <img src="AI-GOV.png" alt="AI-GOV 公司 LOGO" />
      </a>
    </div>
    <div class="footer-right">
      <div>經濟部商業發展署 - 服務業數位轉型培力補助 執行夥伴</div>
      <div>© 2026 AI-GOV All rights reserved.</div>
    </div>
  </footer>

  <div id="image-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <img class="modal-image" alt="放大圖片顯示" />
  </div>

  <script>
    const modal = document.getElementById('image-modal');
    const modalImage = modal.querySelector('.modal-image');
    const images = document.querySelectorAll('img');

    images.forEach((image) => {
      image.addEventListener('click', (event) => {
        const target = event.currentTarget;
        modalImage.src = target.src;
        modalImage.alt = target.alt || '圖片放大預覽';
        modal.classList.add('active');
        modal.setAttribute('aria-hidden', 'false');
      });
    });

    modal.addEventListener('click', (event) => {
      if (event.target === modal || event.target === modalImage) {
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
        modalImage.src = '';
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('active')) {
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
        modalImage.src = '';
      }
    });
  </script>
</body>
</html>
